version: 2
project_name: xdl

before:
  hooks:
    - go mod tidy

builds:
  - id: xdl
    main: ./cmd/xdl
    binary: xdl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64

archives:
  - id: binaries
    ids:
      - xdl
    format: binary
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if eq .Os \"windows\" }}.exe{{ end }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
